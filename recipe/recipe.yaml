schema_version: 1

context:
  name: executorlib-core
  version: "0.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/executorlib_core-${{ version }}.tar.gz
  sha256: 595102d45ea77718e2234f51f9d8ab0e8c8d3b713fa2cfed12b379cdbd84c9bc

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - cloudpickle
    - tqdm
    - pyzmq
    - versioneer
    - toml
    - setuptools
  run:
    - cloudpickle >=2.0.0,<=3.0.0
    - python >=${{ python_min }}
    - tqdm >=4.44.0,<=4.66.2
    - pyzmq >=25.0.0,<=26.0.2

tests:
  - python:
      imports:
        - executorlib_core
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Library to develop your own concurrent.futures.Executor classes.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/executorlib/executorlib-core

extra:
  recipe-maintainers:
    - jan-janssen
